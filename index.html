<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>微碧官網翻新提案｜三種風格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --text:#181c1f; --text-2:#5b5f63; --border:#e3e6ea; --primary:#f14f47; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; color:var(--text); background:#f6f7f9; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1200px; margin:0 auto; padding:48px 20px 64px; }
  header{ text-align:center; margin-bottom:32px; }
  .eyebrow{ color:var(--primary); font-size:14px; font-weight:500; margin:0 0 8px; }
  h1{ font-size:28px; line-height:1.35; margin:0; }
  .lead{ color:var(--text-2); font-size:16px; line-height:1.7; margin:12px 0 0; }
  .grid{ display:grid; gap:20px; }
  .card{ display:flex; flex-direction:column; background:#fff; border:1px solid var(--border); border-radius:20px; overflow:hidden; transition:transform .25s, box-shadow .25s; }
  .card:hover{ transform:translateY(-4px); box-shadow:0 16px 40px rgba(24,28,31,.10); }
  .thumb{ aspect-ratio:16/10; background:#eceef1; border-bottom:1px solid var(--border); }
  .thumb img{ width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .body{ padding:20px 22px 22px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .body h2{ font-size:20px; margin:0; display:flex; align-items:center; gap:10px; }
  .dot{ width:12px; height:12px; border-radius:50%; flex:none; }
  .body p{ margin:0; color:var(--text-2); font-size:15px; line-height:1.7; flex:1; }
  .go{ margin-top:12px; display:inline-flex; align-items:center; gap:6px; color:var(--primary); font-weight:500; font-size:15px; }
  .go svg{ width:16px; height:16px; transition:transform .2s; }
  .card:hover .go svg{ transform:translateX(3px); }
  footer{ margin-top:40px; text-align:center; color:var(--text-2); font-size:13px; }
  @media (min-width:768px){ .wrap{ padding:72px 32px 80px; } h1{ font-size:36px; } .grid{ grid-template-columns:repeat(3,1fr); gap:24px; } header{ margin-bottom:48px; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">微碧官網翻新提案</p>
    <h1>三種視覺風格</h1>
    <p class="lead">點選卡片開啟各版本，手機、平板、電腦都可以瀏覽</p>
  </header>
  <div class="grid">
    <a class="card" href="pro/">
      <div class="thumb"><img src="thumbs/pro.jpg" alt="專業可靠版首頁預覽" width="800" height="500"></div>
      <div class="body">
        <h2><span class="dot" style="background:#181c1f"></span>專業可靠</h2>
        <p>白底、深色字與俐落的 8px 圓角，資訊清楚、穩重值得信賴。</p>
        <span class="go">開啟版本<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224.49 136.49l-72 72a12 12 0 0 1-17-17L187 140H40a12 12 0 0 1 0-24h147l-51.49-51.51a12 12 0 0 1 17-17l72 72a12 12 0 0 1-.02 17z"/></svg></span>
      </div>
    </a>
    <a class="card" href="warm/">
      <div class="thumb"><img src="thumbs/warm.jpg" alt="溫暖親切版首頁預覽" width="800" height="500"></div>
      <div class="body">
        <h2><span class="dot" style="background:#eab361"></span>溫暖親切</h2>
        <p>奶油底色、真實店家照片與大圓角，像老朋友一樣好親近。</p>
        <span class="go">開啟版本<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224.49 136.49l-72 72a12 12 0 0 1-17-17L187 140H40a12 12 0 0 1 0-24h147l-51.49-51.51a12 12 0 0 1 17-17l72 72a12 12 0 0 1-.02 17z"/></svg></span>
      </div>
    </a>
    <a class="card" href="soft/">
      <div class="thumb"><img src="thumbs/soft.jpg" alt="柔和科技版首頁預覽" width="800" height="500"></div>
      <div class="body">
        <h2><span class="dot" style="background:#ae79e0"></span>柔和科技</h2>
        <p>淡紫光暈、玻璃質感與流暢動態，輕盈又有科技感。</p>
        <span class="go">開啟版本<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224.49 136.49l-72 72a12 12 0 0 1-17-17L187 140H40a12 12 0 0 1 0-24h147l-51.49-51.51a12 12 0 0 1 17-17l72 72a12 12 0 0 1-.02 17z"/></svg></span>
      </div>
    </a>
  </div>
  <footer>提案示意稿，內容與數據僅供討論使用</footer>
</main>
</body>
</html>
